# Publishes a Revise release. A push to a branch named publish/vX.Y.Z containing
# the installer (split into parts under 100 MB), its blockmap, latest.yml and notes.md
# is turned into a GitHub Release here, and the branch is then deleted.
name: Publish release

on:
  push:
    branches: ["publish/v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and verify installer
        id: build
        run: |
          tag="${GITHUB_REF_NAME#publish/}"
          v="${tag#v}"
          exe="Revise-Setup-$v.exe"
          cat dist/$exe.part* > "$exe"
          want=$(grep -m1 '^sha512:' dist/latest.yml | awk '{print $2}')
          got=$(openssl dgst -sha512 -binary "$exe" | base64 -w0)
          [ "$want" = "$got" ] || { echo "Checksum mismatch"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "exe=$exe" >> "$GITHUB_OUTPUT"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.build.outputs.tag }}" --target main \
            --title "Revise ${{ steps.build.outputs.tag }}" --notes-file dist/notes.md \
            "${{ steps.build.outputs.exe }}" "dist/${{ steps.build.outputs.exe }}.blockmap" dist/latest.yml
      - name: Remove publish branch
        if: always()
        run: git push origin --delete "$GITHUB_REF_NAME" || true
